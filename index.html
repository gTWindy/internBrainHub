<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witcher's world</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="adaptive.css">
    <link rel="icon" href="main/main-1024.png" type="image/x-icon">

<body>
    <div class='back-button-container'>
        <button class="back-button back-button__left-button">Back</button>
        <div class="underline"></div>
    </div>
    <div class="main-block">
        <div class="row main-row">
            <button class="image-button image-button__left-arrow">
                <img src="buttons/arrow.svg" alt="Кнопка" class="button-arrow" />
            </button>
            <div class='main-card'>
                <img id="main-pic" alt="Main picture">
                <span class="text main-text"></span>
                <span class="text description-text"></span>
                <div class="icon main-icon-div">
                    <img src="buttons/icon_number.png">
                    <span class='text text-icon-number'>
                </div>
            </div>
            <button class="image-button image-button__right-arrow">
                <img src="buttons/arrow.svg" alt="Кнопка" class="button-arrow" />
            </button>
        </div>
    </div>
    <button class="image-button image-button__right-button">
        <img src="buttons/logoStart.png" alt="Кнопка" class="corner-image" />
    </button>
    <div class="rod" style='display: none; justify-content: center;'>
    </div>
    <div class="row childs-row childs-row__start">
    </div>

    <script src="scripts/input.js"></script>
    <script src="scripts/elements.js"></script>
    <script src="scripts/personController.js"></script>
    <script src="scripts/main.js"></script>
</body>

</html>
