<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witcher's world</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="adaptive.css">
    <link rel="icon" href="main/main-1024.png" type="image/x-icon">

<body>
    <div class='back-button-container'>
        <button class="back-button back-button__left-button">Back</button>
        <div class="underline"></div>
    </div>
    <div class="main-block">
        <div class="row main-row main-row__start">
            <button class="image-button image-button__left-arrow">
                <img src="buttons/arrow.svg" alt="Кнопка" class="button-arrow" />
            </button>
            <div class='main-card'>
                <img id="main-pic" src="main/main-1024.svg" alt="Main picture" class="main-card__pic_start">
            </div>
            <button class="image-button image-button__right-arrow">
                <img src="buttons/arrow.svg" alt="Кнопка" class="button-arrow" />
            </button>
        </div>
    </div>
    <button class="image-button image-button__right-button">
        <img src="buttons/logoStart.png" alt="Кнопка" class="corner-image" />
    </button>
    <div class="rod" style='display: none; justify-content: center;'>
    </div>
    <div class="row childs-row childs-row__start">
        <div class="mini-card">
            <img id=1 src="images/nilfgaard.jpg" alt="Nilfgaard" class="mini-card__image mini-card__image_state">
            <span class="mini-card__name" class="text">Nilfgaard</span>
        </div>
        <div class="mini-card">
            <img id=2 src="images/redania.jpg" alt="Redania" class="mini-card__image mini-card__image_state">
            <span class="mini-card__name" class="text">Redania</span>
        </div>
        <div class="mini-card">
            <img id=3 src="images/skellige.jpg" alt="Skellige" class="mini-card__image mini-card__image_state">
            <span class="mini-card__name" class="text">Skellige</span>
        </div>
    </div>
    

    <script src="input.js"></script>
    <script src="main.js"></script>
</body>

</html>
